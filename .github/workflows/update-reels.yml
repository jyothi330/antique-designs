name: Update Instagram reels

on:
  schedule:
    - cron: "30 3 * * *"   # every day at 03:30 UTC (9:00 AM IST)
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install yt-dlp imageio-ffmpeg

      - name: Refresh reels
        run: python update_reels.py

      - name: Commit changes
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add index.html reels
          if git diff --cached --quiet; then
            echo "No new reels."
          else
            git commit -m "Update Instagram reels"
            git push
          fi
