  input, select, textarea { outline: none; transition: border .2s; }
  input:focus, select:focus, textarea:focus { border-color: #c98d1a !important; }
  .mobile-nav { display: none; }
  @media(max-width:768px) {

    .main-content { margin-left: 0 !important; }
  }
  .fade-in { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ── STATUS BADGE ── */
function badge(status) {
  const map = {
    'Approved':'green','Received':'green','Available':'green','In Production':'blue','Ready to Ship':'blue',
    'Pending':'yellow','Materials Ordered':'yellow','Design Review':'yellow','On Order':'yellow',
    'Draft':'gray','Rejected':'red',
  };
  const cls = map[status] || 'gray';
  return `<span class="badge badge-${cls}">${status}</span>`;
}

              placeholder="admin@antique-designs.com"
              oninput="state.loginEmail=this.value"/>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Password</label>
            <input type="password" id="loginPass" value="${state.loginPass}"

              placeholder="••••••••"
              oninput="state.loginPass=this.value"
              onkeydown="if(event.key==='Enter')doLogin()"/>
          </div>
          <div class="flex items-center justify-between text-xs text-gray-500">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" class="rounded"/> Remember me
            </label>
            <a href="#" class="text-brand-600 hover:underline">Forgot password?</a>

function doLogin() {
  const e = document.getElementById('loginEmail');
  const p = document.getElementById('loginPass');
  const email = (e ? e.value : state.loginEmail).trim();
  const pass  = (p ? p.value : state.loginPass).trim();
  if (!email) { state.loginError = 'Please enter your email.'; render(); return; }
  if (!pass)  { state.loginError = 'Please enter your password.'; render(); return; }
  if (email !== 'antiquedesigns123@gmail.com' || pass !== 'Antique123') {
    state.loginError = 'Invalid email or password. Please try again.';
    render(); return;
  }
  state.loggedIn   = true;
  state.loginError = '';
  state.screen     = 'dashboard';
  render();
}

/* ── Product store (localStorage) ───────────────────────────────────────── */
var PRODUCT_CATEGORIES_LIST = ['Main Doors','Panel Accessories','Grill Accessories','Studs','Vaskal Accessories','Pooja Doors','Railings','Name Plates','Concept Doors','Other'];

function loadProducts() {
  try {
    var saved = localStorage.getItem('ad_products');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  // Seed from SAMPLE on first load
  return SAMPLE.products.map(function(p) {
    return {
      id:          p.id,
      name:        p.name,
      category:    p.category,
      description: '',
      dimensions:  '',
      thickness:   '',
      unit:        p.unit,
      price:       p.price.replace('₹','').replace('+','').replace(/,/g,'').trim(),
      hsnCode:     '74199930',
      imageData:   null,
      status:      p.stock === 'Available' ? 'active' : 'inactive',
      createdAt:   new Date().toLocaleDateString('en-IN'),
    };
  });
}

function saveProducts(list) {
  try { localStorage.setItem('ad_products', JSON.stringify(list)); } catch(e) {}
}

function genProductId() {
  var list = loadProducts();
  var max = list.reduce(function(m, p) {
    var n = parseInt((p.id || '0').replace(/\D/g,'')) || 0;
    return Math.max(m, n);
  }, 0);
  return 'P-' + String(max + 1).padStart(3,'0');
}

/* ── Modal state ─────────────────────────────────────────────────────────── */
var productModal = {
  open:     false,
  mode:     'add',   // 'add' | 'edit'
  editId:   null,
  form:     { name:'', category:'', description:'', dimensions:'', thickness:'', unit:'', price:'', hsnCode:'74199930', imageData:null },
  errors:   {},
  catFilter:'All',
  statusFilter:'all',
  previewImg: null,
};

function openAddProduct() {
  productModal.open   = true;
  productModal.mode   = 'add';
  productModal.editId = null;
  productModal.errors = {};
  productModal.previewImg = null;
  productModal.form = { name:'', category:'', description:'', dimensions:'', thickness:'', unit:'', price:'', hsnCode:'74199930', imageData:null };
  render();
  setTimeout(function(){ var el=document.getElementById('pm_name'); if(el) el.focus(); },50);
}

function openEditProduct(id) {
  var list = loadProducts();
  var p = list.find(function(x){ return x.id === id; });
  if (!p) return;
  productModal.open   = true;
  productModal.mode   = 'edit';
  productModal.editId = id;
  productModal.errors = {};
  productModal.previewImg = p.imageData || null;
  productModal.form = {
    name:        p.name        || '',
    category:    p.category    || '',
    description: p.description || '',
    dimensions:  p.dimensions  || '',
    thickness:   p.thickness   || '',
    unit:        p.unit        || '',
    price:       p.price       || '',
    hsnCode:     p.hsnCode     || '',
    imageData:   p.imageData   || null,
  };
  render();
  setTimeout(function(){ var el=document.getElementById('pm_name'); if(el) el.focus(); },50);
}

function closeProductModal() {
  productModal.open = false;
  productModal.previewImg = null;
  render();
}

function pmField(field, val) {
  productModal.form[field] = val;
  if (productModal.errors[field]) { delete productModal.errors[field]; }
  // live re-render only the error span to avoid losing focus
  var errEl = document.getElementById('pm_err_' + field);
  if (errEl) errEl.textContent = '';
  // live-update price display
  if (field === 'price') {
    var disp = document.getElementById('pm_price_disp');
    if (disp) {
      var n = parseFloat(val);
      disp.textContent = (!isNaN(n) && n >= 0) ? '= ' + fmtINR(n) : '';
    }
  }
}

function pmImagePick(input) {
  var file = input.files[0];
  if (!file) return;
  var allowed = ['image/jpeg','image/png','image/webp'];
  if (!allowed.includes(file.type)) {
    alert('Only JPG, PNG or WebP images are allowed.'); input.value=''; return;
  }
  if (file.size > 5 * 1024 * 1024) {
    alert('Image must be smaller than 5 MB.'); input.value=''; return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    productModal.form.imageData = e.target.result;
    productModal.previewImg = e.target.result;
    var prev = document.getElementById('pm_img_preview');
    var placeholder = document.getElementById('pm_img_placeholder');
    if (prev) { prev.src = e.target.result; prev.style.display='block'; }
    if (placeholder) placeholder.style.display='none';
    var removeBtn = document.getElementById('pm_img_remove');
    if (removeBtn) removeBtn.style.display='inline-flex';
  };
  reader.readAsDataURL(file);
}

function pmRemoveImage() {
  productModal.form.imageData = null;
  productModal.previewImg = null;
  var prev = document.getElementById('pm_img_preview');
  var placeholder = document.getElementById('pm_img_placeholder');
  var removeBtn = document.getElementById('pm_img_remove');
  if (prev) { prev.src=''; prev.style.display='none'; }
  if (placeholder) placeholder.style.display='flex';
  if (removeBtn) removeBtn.style.display='none';
  var fileInput = document.getElementById('pm_file_input');
  if (fileInput) fileInput.value='';
}

function fmtINR(n) {
  return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function validateProductForm() {
  var f = productModal.form;
  var e = {};
  if (!f.name.trim())     e.name     = 'Product name is required.';
  if (!f.category.trim()) e.category = 'Please select a category.';
  if (!f.unit.trim())     e.unit     = 'Unit of measurement is required.';
  var price = parseFloat(f.price);
  if (!f.price.trim())           e.price = 'Unit price is required.';
  else if (isNaN(price)||price<0) e.price = 'Enter a valid price (0 or above).';
  else if (price > 10000000)     e.price = 'Price cannot exceed ₹1,00,00,000.';
  return e;
}

function submitProductForm() {
  var errors = validateProductForm();
  productModal.errors = errors;
  if (Object.keys(errors).length > 0) { render(); return; }

  var list = loadProducts();
  var f = productModal.form;
  var now = new Date().toLocaleDateString('en-IN');

  if (productModal.mode === 'add') {
    list.unshift({
      id:          genProductId(),
      name:        f.name.trim(),
      category:    f.category,
      description: f.description.trim(),
      dimensions:  f.dimensions.trim(),
      thickness:   f.thickness.trim(),
      unit:        f.unit.trim(),
      price:       f.price.trim(),
      hsnCode:     f.hsnCode.trim(),
      imageData:   f.imageData || null,
      status:      'active',
      createdAt:   now,
    });
  } else {
    list = list.map(function(p) {
      if (p.id !== productModal.editId) return p;
      return Object.assign({}, p, {
        name:        f.name.trim(),
        category:    f.category,
        description: f.description.trim(),
        dimensions:  f.dimensions.trim(),
        thickness:   f.thickness.trim(),
        unit:        f.unit.trim(),
        price:       f.price.trim(),
        hsnCode:     f.hsnCode.trim(),
        imageData:   f.imageData !== undefined ? f.imageData : p.imageData,
        updatedAt:   now,
      });
    });
  }
  saveProducts(list);
  closeProductModal();
  showProductToast(productModal.mode === 'add' ? 'Product added successfully!' : 'Product updated successfully!');
}

function deleteProduct(id) {
  var list = loadProducts();
  var p = list.find(function(x){ return x.id===id; });
  if (!p) return;
  if (!confirm('"' + p.name + '" will be removed. This cannot be undone.\n\nAre you sure?')) return;
  list = list.filter(function(x){ return x.id !== id; });
  saveProducts(list);
  render();
}

function toggleProductStatus(id) {
  var list = loadProducts();
  list = list.map(function(p) {
    if (p.id !== id) return p;
    var next = p.status === 'active' ? 'inactive' : 'active';
    return Object.assign({}, p, { status: next });
  });
  saveProducts(list);
  render();
}

var _productToastTimer = null;
function showProductToast(msg) {
  var t = document.getElementById('product_toast');
  if (!t) { render(); setTimeout(function(){ showProductToast(msg); }, 50); return; }
  t.textContent = msg;
  t.classList.remove('opacity-0');
  t.classList.add('opacity-100');
  clearTimeout(_productToastTimer);
  _productToastTimer = setTimeout(function(){
    t.classList.remove('opacity-100');
    t.classList.add('opacity-0');
  }, 3000);
}

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">

              <div style="position:relative;">

          <!-- Dimensions + Thickness -->

            <div>
              <label style="display:block;font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">Dimensions</label>

                + '<td class="px-4 py-3 text-right font-bold text-amber-700">' + (p.price ? fmtINR(parseFloat(p.price)||0) : '—') + '</td>'
                + '<td class="px-4 py-3 text-gray-500 text-xs">' + esc(p.unit) + '</td>'
                + '<td class="px-4 py-3"><span class="badge ' + (isActive ? 'badge-green' : 'badge-gray') + '">' + (isActive ? 'Active' : 'Inactive') + '</span></td>'

                + '<span class="text-gray-300">|</span>'
                + '<button onclick="deleteProduct(\'' + p.id + '\')" class="text-red-400 hover:text-red-600">Delete</button>'
                + '</div></td></tr>';
            }).join('')
          }
        </tbody>
      </table>
    </div>
  </div>

  <!-- Cards (mobile) -->
  <div class="grid sm:grid-cols-2 gap-4 md:hidden">
    ${rows.map(function(p){
      var isActive = p.status==='active';
      return '<div class="card p-4' + (!isActive ? ' opacity-60' : '') + '">'
        + '<div class="w-full h-32 rounded-lg mb-3 overflow-hidden bg-amber-50 border border-amber-100 flex items-center justify-center">'
        + (p.imageData ? '<img src="' + p.imageData + '" style="width:100%;height:100%;object-fit:cover;"/>' : '<span style="font-size:36px;">🪔</span>')
        + '</div>'
        + '<div class="font-semibold text-gray-800 text-sm mb-1">' + esc(p.name) + '</div>'
        + '<div class="text-xs text-gray-400 mb-2">' + esc(p.category) + '</div>'
        + '<div class="flex items-center justify-between mb-3">'
        + '<span class="text-amber-700 font-bold text-sm">' + (p.price ? fmtINR(parseFloat(p.price)||0) : '—') + '</span>'
        + '<span class="badge ' + (isActive ? 'badge-green' : 'badge-gray') + '">' + (isActive ? 'Active' : 'Inactive') + '</span>'
        + '</div>'
        + '<div class="flex gap-2 text-xs pt-2 border-t border-gray-100">'
        + '<button onclick="openEditProduct(\'' + p.id + '\')" class="text-brand-600 font-semibold hover:underline">Edit</button>'
        + '<span class="text-gray-300">|</span>'
        + '<button onclick="toggleProductStatus(\'' + p.id + '\')" class="font-medium ' + (isActive ? 'text-gray-500' : 'text-green-700') + '">' + (isActive ? 'Deactivate' : 'Activate') + '</button>'
        + '<span class="text-gray-300">|</span>'
        + '<button onclick="deleteProduct(\'' + p.id + '\')" class="text-red-400">Delete</button>'
        + '</div></div>';
    }).join('')}

    <div onclick="openAddProduct()" class="card p-4 border-dashed border-2 border-gray-200 flex flex-col items-center justify-center text-gray-300 cursor-pointer hover:border-brand-300 hover:text-brand-300 transition-all min-h-[160px]">
      <div class="text-4xl mb-2">+</div>
      <div class="text-sm font-medium">Add Product</div>
    </div>
  </div>

  <p class="text-xs text-gray-400 text-center mt-4">Products are saved in your browser's local storage.</p>`;
}

  const q = state.searchQ.toLowerCase();
  const rows = SAMPLE.customers.filter(r =>
    !q || r.name.toLowerCase().includes(q) || r.place.toLowerCase().includes(q) || r.phone.includes(q)

  return `
  <div class="mb-4 flex items-center justify-between gap-3">
